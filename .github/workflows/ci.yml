name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# The workflow only reads the code, so don't give its token write access
permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install uv and enable caching
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # 3. Install Python and project dependencies from uv.lock
      # --frozen ensures uv doesn't try to update the lockfile in CI
      - name: Sync dependencies
        run: uv sync --frozen --all-extras --dev

      # 4. Run Ruff (Linter)
      - name: Run Ruff Linter
        run: uv run ruff check .

      # 5. Run Ruff (Formatter check)
      - name: Run Ruff Formatter
        run: uv run ruff format --check .

      # 6. Run Mypy
      - name: Run Mypy
        run: uv run mypy src

      # 7. Run Pytest (tests/conftest.py sets dummy settings, so no .env is needed)
      - name: Run Pytest
        run: uv run pytest